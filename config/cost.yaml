# ============================================================
# 해외의류 소싱 크롤러 - 원가 계산 설정
# 규정/요율이 바뀌면 이 파일만 수정한다. 코드는 건드리지 않는다.
# 최종 확인일: 2026-09-03
# ============================================================

meta:
  last_verified: "2026-09-03"
  source_note: "관세청 기준. 요율은 배대지 공지 기준으로 분기마다 재확인할 것."

# ------------------------------------------------------------
# 환율 (실행 시점 값으로 갱신. 카드 수수료 포함한 '실질환율' 권장)
#   실질환율 = 매매기준율 * (1 + card_fee_rate)
# ------------------------------------------------------------
fx:
  card_fee_rate: 0.025          # 해외카드 수수료 약 2.5% (비자/마스터 1% + 은행 1.5%)
  as_of: "2026-09-03"           # 아래 고정값의 기준일. 스캔 시 실시간 환율을 받으면 그 날짜로 교체된다
  source: "config/cost.yaml 고정값"
  base_rate:                    # 매매기준율 (수동 갱신 또는 API 주입)
    USD: 1380.0
    EUR: 1490.0
    JPY: 9.2                    # 100엔이 아니라 1엔 기준
    # GBP는 일부러 비워둔다 — 환율만 넣고 영국 세금·배대지 조건을 EU 규칙으로
    # 대신 쓰면 원가가 틀어진다. markets.GB의 cost_profile이 null인 이유와 같다.

# ------------------------------------------------------------
# 시장(국가) → 통화 / 원가 프로필 / 현지 부가세율
#   marketCountry는 '실제 쇼핑 시장'이고, cost_profile은 '세율·배대지 요율을
#   아는 구간(US/EU/JP)'이다. 둘을 같은 것으로 보면 안 된다.
#   cost_profile이 null인 시장은 원문 가격만 보존하고 원가는 "계산 미완료"로 표시한다.
# ------------------------------------------------------------
markets:
  US: { currency: USD, cost_profile: US }
  JP: { currency: JPY, cost_profile: JP }
  DE: { currency: EUR, cost_profile: EU, vat_rate: 0.19 }
  FR: { currency: EUR, cost_profile: EU, vat_rate: 0.20 }
  IT: { currency: EUR, cost_profile: EU, vat_rate: 0.22 }
  ES: { currency: EUR, cost_profile: EU, vat_rate: 0.21 }
  NL: { currency: EUR, cost_profile: EU, vat_rate: 0.21 }
  GB:
    currency: GBP
    cost_profile: null          # 영국은 EU가 아니다. 세금·배대지 조건을 검증하기 전까지 계산하지 않는다
    note: "영국 시장 — VAT 환급·배대지 요율 미검증이라 원가 계산을 하지 않습니다(원문 가격만 표시)"

# ------------------------------------------------------------
# 현지 판매세 / 부가세
#   - US: 배대지가 있는 州의 sales tax. 면세 州를 쓰면 0
#   - EU: 표시가에 VAT 포함 → 한국 배송 시 차감되어 결제됨 (핵심!)
#   - JP: 표시가가 세込이면 면세 처리로 차감됨
# ------------------------------------------------------------
local_tax:
  US:
    sales_tax_rate: 0.0         # 오리건/델라웨어 배대지 기준 0. 州 변경 시 수정
    price_includes_tax: false
  EU:
    vat_rate: 0.22              # 이탈리아 22% / 독일 19% / 프랑스 20% - 사이트별 조정
    price_includes_tax: true    # 유럽 표시가는 VAT 포함이 기본
  JP:
    vat_rate: 0.10              # 소비세 10%
    price_includes_tax: true    # 세込 표시면 true, 税抜이면 false

# ------------------------------------------------------------
# 배대지 국제배송비 (무게 구간, 원화)
#   실제 요율표로 교체할 것. 부피무게 적용 사이트는 volumetric_divisor 사용
# ------------------------------------------------------------
shipping:
  volumetric_divisor: 6000      # (가로*세로*높이 cm) / 6000 = 부피무게(kg)
  handling_fee_krw: 2000        # 배대지 취급/검수 수수료
  rates_krw:                    # 무게(kg) 상한 : 요금(원)
    US:
      0.5: 12000
      1.0: 17000
      2.0: 26000
      3.0: 34000
      5.0: 50000
      10.0: 88000
    EU:
      0.5: 15000
      1.0: 21000
      2.0: 33000
      3.0: 44000
      5.0: 66000
      10.0: 115000
    JP:
      0.5: 8000
      1.0: 11000
      2.0: 16000
      3.0: 21000
      5.0: 31000
      10.0: 55000
  over_max_per_kg_krw:          # 최대 구간 초과 시 kg당 추가요금
    US: 9000
    EU: 12000
    JP: 5500

# ------------------------------------------------------------
# 관세 (품목별)
# ------------------------------------------------------------
customs:
  vat_rate: 0.10                # 수입 부가세 10%
  duty_rates:                   # 품목별 관세율
    apparel: 0.13               # 의류
    shoes: 0.13                 # 신발
    bag: 0.08                   # 가방 (200만원 이하)
    watch: 0.08                 # 시계 (200만원 미만)
    accessory: 0.08             # 선글라스 등
    default: 0.13

  # 개인 자가사용(구매대행 = 고객 명의 개인통관) 면세 한도 (USD)
  # 미국발 목록통관 200달러, 그 외 국가 150달러
  # 한도 초과 시 초과분이 아니라 '전체 과세가격'에 과세됨
  personal_exemption_usd:
    US: 200
    EU: 150
    JP: 150

  # 과세가격에 국제운임을 포함할지 여부 (관세청 기준: 포함)
  include_shipping_in_dutiable: true

  clearance_fee_krw: 0          # 사업자 통관 시 관세사 수수료 (건당)

# ------------------------------------------------------------
# 판매 채널 수수료 (마진 계산용)
# ------------------------------------------------------------
sales:
  channel_fee_rate:
    smartstore: 0.0374          # 네이버 스마트스토어(주문관리+매출연동 대략)
    coupang: 0.108
    own_mall: 0.033             # 자사몰 PG 수수료
    kream: 0.030
  domestic_shipping_krw: 3500   # 국내 배송비 (판매자 부담분)
  packaging_krw: 800
  return_rate: 0.05             # 반품률 가정 (원가에 리스크로 가산)
